name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: unzip -q project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Find newest Fabric API for 26.1.2
        working-directory: anubis-261
        run: |
          V=$(python3 build-support/latest_fabric_api.py 26.1.2)
          echo "Fabric API: ${V:-<none found, using gradle.properties>}"
          echo "FABRIC_API_ARG=${V:+-Pfabric_api_version=$V}" >> "$GITHUB_ENV"

      - name: Port source to Mojang names (skips itself if already done)
        working-directory: anubis-261
        run: python3 build-support/port_to_mojang.py src/main 1.21.11 2>&1 | tee port-log.txt

      - name: Build
        working-directory: anubis-261
        run: |
          chmod +x gradlew
          ./gradlew build $FABRIC_API_ARG --stacktrace 2>&1 | tee build-log.txt

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anubis-mod
          path: |
            anubis-261/build/libs/*.jar
            !anubis-261/build/libs/*-sources.jar

      - name: Upload ported source + logs (needed if the build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ported-source-and-logs
          path: |
            anubis-261/src/
            anubis-261/port-report.txt
            anubis-261/port-log.txt
            anubis-261/build-log.txt
