name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: unzip -q project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: bash anubis-261/ci/build.sh

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anubis-mod
          path: |
            anubis-261/build/libs/*.jar
            !anubis-261/build/libs/*-sources.jar

      - name: Upload ported source + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ported-source-and-logs
          path: |
            anubis-261/src/
            anubis-261/port-report.txt
            anubis-261/port-log.txt
            anubis-261/build-log.txt
